name: CardKeeper v5 Stable Preview

on:
  push:
    branches:
      - v5-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v5-stable
        uses: actions/checkout@v4

      - name: Prepare preview artifact
        run: |
          mkdir -p preview
          cp -R index.html manifest.json sw.js css js icons preview/
          printf '%s\n' "CardKeeper v5 Stable preview build" > preview/BUILD.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardkeeper-v5-stable-preview
          path: preview
          if-no-files-found: error
