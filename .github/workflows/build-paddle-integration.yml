name: Build PaddleOCR integration

on:
  pull_request:
    branches: [paddle-integration-test]
  push:
    branches: [paddle-integration-test]
    paths:
      - 'paddle-integration/**'
      - '.github/workflows/build-paddle-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: paddle-integration
        run: npm install
      - name: Build browser bundle
        working-directory: paddle-integration
        run: npm run build
      - name: Commit built bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paddle-integration/dist
          if git diff --cached --quiet; then
            echo "No build changes"
          else
            git commit -m "Build PaddleOCR integration bundle"
            git push
          fi
