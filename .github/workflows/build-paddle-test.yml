name: Build PaddleOCR Test

on:
  push:
    branches: [paddleocr-test]
    paths:
      - 'paddle-src/**'
      - '.github/workflows/build-paddle-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paddleocr-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: paddle-src
        run: npm install
      - name: Build
        working-directory: paddle-src
        run: npm run build
      - name: Commit built test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paddle-built
          if git diff --cached --quiet; then
            echo "No build changes"
          else
            git commit -m "Build PaddleOCR browser test"
            git push origin HEAD:paddleocr-test
          fi
